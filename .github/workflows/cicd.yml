deploy:
  name: Deploy to EC2 (${{ github.event_name == 'push' && 'dev' || github.event.inputs.environment }})
  needs: build

  if: |
    github.event_name == 'push' ||
    (
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.run_deploy == 'true'
    )

  runs-on: [self-hosted, linux]

  environment: ${{ github.event_name == 'push' && 'dev' || github.event.inputs.environment }}

  steps:
    - name: Download the built artifact
      uses: actions/download-artifact@v4
      with:
        name: app-package

    - name: Show deployment details
      run: |
        if [ "${{ github.event_name }}" = "push" ]; then
          echo "Environment : dev"
        else
          echo "Environment : ${{ github.event.inputs.environment }}"
        fi

        echo "Artifact : ${{ needs.build.outputs.artifact_name }}"

    - name: Select target host
      id: target
      run: |
        if [ "${{ github.event_name }}" = "push" ]; then
          echo "host=${{ secrets.EC2_HOST_DEV }}" >> "$GITHUB_OUTPUT"
          echo "app_env=dev" >> "$GITHUB_OUTPUT"

        elif [ "${{ github.event.inputs.environment }}" = "prod" ]; then
          echo "host=${{ secrets.EC2_HOST_PROD }}" >> "$GITHUB_OUTPUT"
          echo "app_env=prod" >> "$GITHUB_OUTPUT"

        else
          echo "host=${{ secrets.EC2_HOST_DEV }}" >> "$GITHUB_OUTPUT"
          echo "app_env=dev" >> "$GITHUB_OUTPUT"
        fi

    - name: Copy artifact to EC2 and restart service
      env:
        SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        SSH_USER: ${{ secrets.EC2_USER }}
        HOST: ${{ steps.target.outputs.host }}
        ARTIFACT: ${{ needs.build.outputs.artifact_name }}
        APP_ENV: ${{ steps.target.outputs.app_env }}
      run: |
        set -euo pipefail

        echo "$SSH_KEY" > deploy_key.pem
        chmod 600 deploy_key.pem

        SSH="ssh -o StrictHostKeyChecking=no -i deploy_key.pem"
        SCP="scp -o StrictHostKeyChecking=no -i deploy_key.pem"

        echo "Uploading $ARTIFACT to $HOST"

        $SCP "$ARTIFACT" "$SSH_USER@$HOST:/tmp/$ARTIFACT"
        $SCP scripts/deploy-remote.sh "$SSH_USER@$HOST:/tmp/deploy-remote.sh"

        $SSH "$SSH_USER@$HOST" \
          "APP_ENV=$APP_ENV ARTIFACT=$ARTIFACT bash /tmp/deploy-remote.sh"

        rm -f deploy_key.pem

    - name: Smoke test
      env:
        SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        SSH_USER: ${{ secrets.EC2_USER }}
        HOST: ${{ steps.target.outputs.host }}
      run: |
        echo "$SSH_KEY" > deploy_key.pem
        chmod 600 deploy_key.pem

        ssh -o StrictHostKeyChecking=no -i deploy_key.pem \
          "$SSH_USER@$HOST" \
          "curl -f http://localhost:3000/health"

        rm -f deploy_key.pem
